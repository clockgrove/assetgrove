# Makes this folder its own pnpm root: the root install never reaches it.
autoInstallPeers: false
packages: []
# LanceDB lists its own embedding helpers (a second Transformers.js with its onnxruntime-node, and
# the OpenAI client) as optional dependencies; the package embeds through its own pinned copy.
ignoredOptionalDependencies:
  - "@huggingface/transformers"
  - openai
allowBuilds:
  onnxruntime-node: false
  protobufjs: false
# The linter resolves a minimatch below its fixed release; the root workspace sets the same floor.
overrides:
  minimatch@>=7.0.0 <11.0.1: ^11.0.1
