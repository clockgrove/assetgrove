name: CI

# The one required check. The repository's command contract is: pnpm install --frozen-lockfile
# --ignore-scripts, then pnpm check (format, lint, types), then pnpm test (offline; scripted
# generation provider, no real model calls).
on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  # Pendulum's work stage dispatches this on pendulum/<issue> to run the macOS and Windows test legs before
  # review (PENDULUM_CROSS_OS_* in pendulum.yml). Not a pull request, so the matrix is the full three systems.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# check: format, lint and types, on Linux. test: the offline suite. A pull request runs it on Linux in four
# shards, so a push gets its answer in about a third of the time. The merge queue and main run it whole on
# Linux, macOS and Windows, so nothing reaches main that fails on any of them. packs lists the packs (every
# directory under packages/ whose package.json has an `assetgrove` field, scripts/packs.ts), and pack runs
# one leg per pack and system, on the same systems as test; each pack has its own install, and its leg does
# its work only when the change touches the pack or what it reads of core and the repository. No pack is
# named here but in the Godot pack's Godot setup: a new pack gets its legs with no edit to this file. search-bench runs the search bench on a
# pull request that touches search. The roll-up `ci`, the one required check, needs check, test, every pack
# leg and the bench when it ran.
#
# The pnpm store is cached per system and lockfile. Only a push to main saves it; pull requests and the
# merge queue restore it read-only, so a pull request can't plant a cache that main would use.
jobs:
  check:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
          package-manager-cache: false

      - name: Enable pnpm from packageManager
        run: corepack enable

      - name: Find the pnpm store
        id: store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Restore the pnpm store
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-

      - name: Install the locked dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Check
        run: pnpm check

  test:
    strategy:
      fail-fast: false
      matrix:
        include: ${{ github.event_name == 'pull_request' && fromJSON('[{"os":"ubuntu-26.04","shard":"1/4"},{"os":"ubuntu-26.04","shard":"2/4"},{"os":"ubuntu-26.04","shard":"3/4"},{"os":"ubuntu-26.04","shard":"4/4"}]') || fromJSON('[{"os":"ubuntu-26.04","shard":"1/3"},{"os":"ubuntu-26.04","shard":"2/3"},{"os":"ubuntu-26.04","shard":"3/3"},{"os":"macos-26","shard":"1/3"},{"os":"macos-26","shard":"2/3"},{"os":"macos-26","shard":"3/3"},{"os":"windows-2025","shard":"1/3"},{"os":"windows-2025","shard":"2/3"},{"os":"windows-2025","shard":"3/3"}]') }}
    name: test (${{ matrix.os }}, ${{ matrix.shard }})
    runs-on: ${{ matrix.os }}
    # Decision: the offline suite is expected to take minutes; 20 bounds a hung run. The merge queue and
    # main shard each system three ways, as pull requests shard Linux: one leg per system ran 15 to 18
    # minutes and crossed 20 on Windows.
    timeout-minutes: 20
    steps:
      - name: Keep line endings as committed
        run: git config --global core.autocrlf false

      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
          package-manager-cache: false

      - name: Enable pnpm from packageManager
        run: corepack enable

      - name: Find the pnpm store
        id: store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Restore the pnpm store
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-

      - name: Install the locked dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      # The same command as `pnpm test`, with the shard this leg runs (1/1 is the whole suite).
      - name: Test
        shell: bash
        run: node --test --test-shard=${{ matrix.shard }} "test/**/*.test.ts"

      - name: Save the pnpm store
        if: github.event_name == 'push' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

  packs:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    outputs:
      list: ${{ steps.list.outputs.list }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The base is the commit this change is measured against: the pull request's base, the merge
      # group's base, or main before the push. With no usable base every leg runs.
      - name: Fetch the base
        shell: bash
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: |
          if [[ "$BASE" =~ ^[0-9a-f]{40}$ && ! "$BASE" =~ ^0+$ ]]; then
            git fetch --quiet --no-tags --depth=1 origin "$BASE" || echo "the base $BASE cannot be fetched; every leg runs"
          fi

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
          package-manager-cache: false

      - name: Enable pnpm from packageManager
        run: corepack enable

      - name: Install the locked dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      # One entry per pack, each saying whether the change touches the pack or what it reads.
      - name: List the packs
        id: list
        shell: bash
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: |
          list=$(node scripts/packs.ts list "$BASE")
          echo "$list"
          echo "list=$list" >> "$GITHUB_OUTPUT"

  pack:
    needs: packs
    if: needs.packs.outputs.list != '[]'
    strategy:
      fail-fast: false
      matrix:
        pack: ${{ fromJSON(needs.packs.outputs.list) }}
        # Pull requests run Linux only; the merge queue and main run Linux, macOS and Windows.
        os: ${{ github.event_name == 'pull_request' && fromJSON('["ubuntu-26.04"]') || fromJSON('["ubuntu-26.04","macos-26","windows-2025"]') }}
    name: pack (${{ matrix.pack.short }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Keep line endings as committed
        if: matrix.pack.touched
        run: git config --global core.autocrlf false

      - name: Check out
        if: matrix.pack.touched
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        if: matrix.pack.touched
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
          package-manager-cache: false

      - name: Enable pnpm from packageManager
        if: matrix.pack.touched
        run: corepack enable

      # A pack's tests import core's source (and may read files beside it), which needs the core's
      # dependencies.
      - name: Install the core's locked dependencies
        if: matrix.pack.touched
        run: pnpm install --frozen-lockfile --ignore-scripts

      # Optional dependencies stay in: a pack's native library may be one.
      - name: Install the pack's locked dependencies
        if: matrix.pack.touched
        working-directory: ${{ matrix.pack.dir }}
        run: pnpm install --frozen-lockfile --ignore-scripts

      # The Godot pack's tests run Godot itself (issue #422): Godot 4.7.2, without .NET, pinned by the
      # setup-godot action, outside the checkout. The action joins path, downloads-path and bin-path onto
      # the home folder (os.homedir(): $HOME, on Windows %USERPROFILE%), so they are relative to it. The
      # tests run the Godot 4.7.2 on PATH; the action puts its link `godot` there, which on Windows has no
      # .exe, so there the console executable's folder goes on PATH too. Without Godot on PATH those tests
      # skip.
      - name: Set up Godot
        if: matrix.pack.touched && matrix.pack.short == 'assetgrove-godot'
        uses: chickensoft-games/setup-godot@ac93246ea68518a384c1c280a496e5989341f2f6 # v2.4.3
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: false
          path: assetgrove-godot
          downloads-path: assetgrove-godot-downloads
          bin-path: assetgrove-godot-bin

      - name: Put the Godot console executable on PATH on Windows
        if: matrix.pack.touched && matrix.pack.short == 'assetgrove-godot' && runner.os == 'Windows'
        shell: bash
        run: |
          exe=$(find "$(cygpath -u "$USERPROFILE")/assetgrove-godot" -name 'Godot_v4.7.2-stable_win64_console.exe' | head -n 1)
          test -n "$exe"
          cygpath -w "$(dirname "$exe")" >> "$GITHUB_PATH"

      - name: Check
        if: matrix.pack.touched
        working-directory: ${{ matrix.pack.dir }}
        run: pnpm check

      - name: Test
        if: matrix.pack.touched
        working-directory: ${{ matrix.pack.dir }}
        run: pnpm test

  # search-bench: the search bench on the labelled library with the real SigLIP2 model, on a pull request
  # that touches search, the bench or what the indexer reads. It fails on a missed quality bar; speed
  # bars count only on the reference box, so they are reported here and never fail the job. The merge
  # queue skips it: it reads only Linux, and the pull request already ran it on its head. A push to main
  # runs it too and saves its cache (the labelled images and the model, both checked by hash), which every
  # pull request restores; a pull request never saves one.
  search-bench:
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: See whether the change touches search
        id: touched
        shell: bash
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          touched=true
          if [[ "$BASE" =~ ^[0-9a-f]{40}$ && ! "$BASE" =~ ^0+$ ]] && git fetch --quiet --no-tags --depth=1 origin "$BASE"; then
            if git diff --quiet "$BASE" HEAD -- packages/assetgrove-search bench/search src/library src/search src/tree docs/decisions.md .github/workflows/ci.yml; then
              touched=false
            fi
          fi
          echo "touched=$touched" >> "$GITHUB_OUTPUT"
          echo "search touched: $touched"

      - name: Set up Node.js
        if: steps.touched.outputs.touched == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
          package-manager-cache: false

      - name: Enable pnpm from packageManager
        if: steps.touched.outputs.touched == 'true'
        run: corepack enable

      - name: Install the core's locked dependencies
        if: steps.touched.outputs.touched == 'true'
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Install the search package's locked dependencies
        if: steps.touched.outputs.touched == 'true'
        working-directory: packages/assetgrove-search
        run: pnpm install --frozen-lockfile --ignore-scripts

      # The labelled images and the pinned model, each checked by hash after a restore or a download. Only a
      # push to main saves them (below), so every pull request restores main's one copy.
      - name: Restore the bench images and model
        if: steps.touched.outputs.touched == 'true'
        id: bench-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            bench/search/.cache
            ${{ runner.temp }}/models
          key: search-bench-${{ hashFiles('bench/search/manifest.json', 'bench/search/inventory-full.csv', 'packages/assetgrove-search/src/model-manifest.json') }}

      # Normally seconds; the bound turns a stalled download into a red step instead of the job's whole limit.
      - name: Download the pinned model
        if: steps.touched.outputs.touched == 'true'
        timeout-minutes: 10
        run: >-
          node --input-type=module -e
          "const { setupModel } = await import('./packages/assetgrove-search/src/setup.ts');
          const { pinnedDownload } = await import('./src/extension/setup.ts');
          const modelsDir = process.env.RUNNER_TEMP + '/models';
          const out = await setupModel({ modelsDir, onProgress: (m) => console.log(m), download: (file) => pinnedDownload(modelsDir, file, { log: (m) => console.log(m) }) });
          console.log('installed', out.dir);"

      - name: Run the bench
        if: steps.touched.outputs.touched == 'true'
        timeout-minutes: 20
        run: node bench/search/run.ts --embedder siglip2 --models "$RUNNER_TEMP/models" --fail-on-miss

      - name: Save the bench images and model
        if: github.event_name == 'push' && steps.touched.outputs.touched == 'true' && steps.bench-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            bench/search/.cache
            ${{ runner.temp }}/models
          key: search-bench-${{ hashFiles('bench/search/manifest.json', 'bench/search/inventory-full.csv', 'packages/assetgrove-search/src/model-manifest.json') }}

  ci:
    needs: [check, test, packs, pack, search-bench]
    if: always()
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      # With no pack, the pack job is skipped; once the list holds one, every leg must succeed.
      - name: Require check, every test leg, every pack leg and the search bench
        env:
          CHECK: ${{ needs.check.result }}
          TEST: ${{ needs.test.result }}
          PACKS: ${{ needs.packs.result }}
          PACK: ${{ needs.pack.result }}
          LIST: ${{ needs.packs.outputs.list }}
          BENCH: ${{ needs.search-bench.result }}
        run: |
          echo "check: $CHECK, test: $TEST, packs: $PACKS, pack: $PACK, search-bench: $BENCH"
          test "$CHECK" = success && test "$TEST" = success && test "$PACKS" = success
          if [ "$LIST" = "[]" ]; then test "$PACK" = skipped; else test "$PACK" = success; fi
          # Skipped in the merge queue and on main; on a pull request it must succeed.
          test "$BENCH" = success || test "$BENCH" = skipped

  # Licence metadata: every file must have a licence and copyright under REUSE 3.3, which the root
  # REUSE.toml assigns by path. A separate job, so the required `ci` check is unchanged.
  reuse:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint REUSE compliance
        uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5 # v6.0.0
