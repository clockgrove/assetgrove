name: Release

# Builds, verifies and attests one tarball of the package, by hand, on main. docs/release.md is the
# owner's guide. verify packs once, refuses a version or tag that already exists, attests the tarball
# and installs and runs it on Linux, macOS and Windows. publish runs only when asked, only when the
# package is already on the registry, and only after the owner approves it in the npm-release
# environment; the first version is published by hand from the verified artifact.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the verified tarball to npm (needs the package to exist already)
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  pack:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # the attestation's signing identity
      attestations: write
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tarball: ${{ steps.pack.outputs.tarball }}
      on-registry: ${{ steps.registry.outputs.exists }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
          package-manager-cache: false

      - name: Enable pnpm from packageManager
        run: corepack enable

      - name: Install the locked dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Read the package name and version
        id: meta
        run: |
          echo "name=$(node -p 'require("./package.json").name')" >> "$GITHUB_OUTPUT"
          echo "version=$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"

      - name: Refuse a version or tag that already exists
        id: registry
        env:
          NAME: ${{ steps.meta.outputs.name }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          if [ -n "$(git ls-remote --tags origin "refs/tags/v$VERSION")" ]; then
            echo "the tag v$VERSION already exists"; exit 1
          fi
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "$NAME@$VERSION is already on the registry"; exit 1
          fi
          if npm view "$NAME" name >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Pack once
        id: pack
        run: |
          mkdir -p out
          pnpm pack --pack-destination out
          cd out
          tarball=$(ls *.tgz)
          sha256sum "$tarball" > "$tarball.sha256"
          cat "$tarball.sha256"
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"

      # "./" matters: npm reads a bare "out/x.tgz" as a GitHub owner/repository shorthand.
      - name: Dry-run the publish
        run: npm publish "./out/${{ steps.pack.outputs.tarball }}" --access public --dry-run

      - name: Attest the tarball
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: out/${{ steps.pack.outputs.tarball }}

      - name: Keep the attestation beside the tarball
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: cp "$BUNDLE" "out/${{ steps.pack.outputs.tarball }}.attestation.jsonl"

      - name: Upload the tarball, its sha256 and its attestation
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: assetgrove-${{ steps.meta.outputs.version }}
          path: out/
          if-no-files-found: error

  verify:
    needs: pack
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, macos-26, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Keep line endings as committed
        run: git config --global core.autocrlf false

      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
          package-manager-cache: false

      - name: Enable pnpm from packageManager
        run: corepack enable

      - name: Install the locked dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Download the tarball
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: assetgrove-${{ needs.pack.outputs.version }}
          path: out

      - name: Install the tarball and run it
        shell: bash
        env:
          TARBALL: ${{ needs.pack.outputs.tarball }}
        run: ASSETGROVE_TEST_TARBALL="$PWD/out/$TARBALL" node --test test/package.test.ts

  publish:
    needs: [pack, verify]
    if: inputs.publish && needs.pack.outputs.on-registry == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    environment: npm-release
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Download the verified tarball
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: assetgrove-${{ needs.pack.outputs.version }}
          path: out

      - name: Publish the verified tarball
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          TARBALL: ${{ needs.pack.outputs.tarball }}
        run: |
          (cd out && sha256sum -c "$TARBALL.sha256")
          npm publish "./out/$TARBALL" --access public --tag latest
