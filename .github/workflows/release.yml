name: Release

# Builds, verifies and attests one tarball of core and of every pack whose version changed, by hand, on
# main. docs/release.md is the owner's guide. plan lists what to release (scripts/packs.ts release):
# every pack (a directory under packages/ whose package.json has an `assetgrove` field) whose
# name@version is not yet on the registry, and core unless its name@version is already there while a
# pack is listed; no pack is named here. pack packs each once, refuses a
# version (and, for core, a tag) that already exists, and attests the tarball; verify installs and runs
# each on Linux, macOS and Windows. publish runs only when asked, only for a package already on the
# registry, and only after the owner approves it in the npm-release environment; a package's first
# version is published by hand from the verified artifact.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the verified tarballs to npm (each package needs to exist already)
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    outputs:
      targets: ${{ steps.plan.outputs.targets }}
      publishable: ${{ steps.plan.outputs.publishable }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
          package-manager-cache: false

      - name: Enable pnpm from packageManager
        run: corepack enable

      - name: Install the locked dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      # Core (left out when its version is published and a pack is listed), then every pack whose
      # version is not on the registry; publishable is the ones whose package exists there already.
      - name: List what to release
        id: plan
        run: |
          targets=$(node scripts/packs.ts release)
          echo "$targets"
          echo "targets=$targets" >> "$GITHUB_OUTPUT"
          echo "publishable=$(node -p 'JSON.stringify(JSON.parse(process.argv[1]).filter((t) => t.onRegistry))' "$targets")" >> "$GITHUB_OUTPUT"

  pack:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.plan.outputs.targets) }}
    name: pack (${{ matrix.target.short }})
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # the attestation's signing identity
      attestations: write
    defaults:
      run:
        working-directory: ${{ matrix.target.dir }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
          package-manager-cache: false

      - name: Enable pnpm from packageManager
        run: corepack enable

      # A pack builds against core's source, so core's dependencies come first.
      - name: Install the core's locked dependencies
        working-directory: .
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Install the pack's locked dependencies
        if: ${{ !matrix.target.core }}
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Refuse a version or tag that already exists
        env:
          NAME: ${{ matrix.target.name }}
          VERSION: ${{ matrix.target.version }}
          CORE: ${{ matrix.target.core }}
        run: |
          if [ "$CORE" = true ] && [ -n "$(git ls-remote --tags origin "refs/tags/v$VERSION")" ]; then
            echo "the tag v$VERSION already exists"; exit 1
          fi
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "$NAME@$VERSION is already on the registry"; exit 1
          fi

      - name: Pack once
        env:
          TARBALL: ${{ matrix.target.tarball }}
        run: |
          mkdir -p out
          pnpm pack --pack-destination out
          cd out
          test "$(ls *.tgz)" = "$TARBALL"
          sha256sum "$TARBALL" > "$TARBALL.sha256"
          cat "$TARBALL.sha256"

      # "./" matters: npm reads a bare "out/x.tgz" as a GitHub owner/repository shorthand.
      - name: Dry-run the publish
        env:
          TARBALL: ${{ matrix.target.tarball }}
        run: npm publish "./out/$TARBALL" --access public --dry-run

      - name: Attest the tarball
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ matrix.target.dir }}/out/${{ matrix.target.tarball }}

      - name: Keep the attestation beside the tarball
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
          TARBALL: ${{ matrix.target.tarball }}
        run: cp "$BUNDLE" "out/$TARBALL.attestation.jsonl"

      - name: Upload the tarball, its sha256 and its attestation
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.target.artifact }}
          path: ${{ matrix.target.dir }}/out/
          if-no-files-found: error

  verify:
    needs: [plan, pack]
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.plan.outputs.targets) }}
        os: [ubuntu-26.04, macos-26, windows-2025]
    name: verify (${{ matrix.target.short }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ${{ matrix.target.dir }}
    steps:
      - name: Keep line endings as committed
        working-directory: .
        run: git config --global core.autocrlf false

      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
          package-manager-cache: false

      - name: Enable pnpm from packageManager
        run: corepack enable

      - name: Install the core's locked dependencies
        working-directory: .
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Install the pack's locked dependencies
        if: ${{ !matrix.target.core }}
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Download the tarball
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ matrix.target.artifact }}
          path: ${{ matrix.target.dir }}/out

      # Every package's own test/package.test.ts installs or unpacks the given tarball and runs it.
      - name: Install the tarball and run it
        shell: bash
        env:
          TARBALL: ${{ matrix.target.tarball }}
        run: ASSETGROVE_TEST_TARBALL="$PWD/out/$TARBALL" node --test test/package.test.ts

  publish:
    needs: [plan, pack, verify]
    if: inputs.publish && needs.plan.outputs.publishable != '[]'
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.plan.outputs.publishable) }}
    name: publish (${{ matrix.target.short }})
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    environment: npm-release
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Download the verified tarball
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ matrix.target.artifact }}
          path: out

      - name: Publish the verified tarball
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          TARBALL: ${{ matrix.target.tarball }}
        run: |
          (cd out && sha256sum -c "$TARBALL.sha256")
          npm publish "./out/$TARBALL" --access public --tag latest
