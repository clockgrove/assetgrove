name: Search shared index round trip

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  ASSETGROVE_R2_PREFIX: assetgrove-gate/${{ github.run_id }}/${{ github.run_attempt }}

jobs:
  write:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
          package-manager-cache: false

      - name: Install locked dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm --dir packages/assetgrove-search install --frozen-lockfile --ignore-scripts

      - name: Index and rebuild the labelled library
        env:
          ASSETGROVE_R2_BUCKET: ${{ secrets.ASSETGROVE_R2_BUCKET }}
          ASSETGROVE_R2_ENDPOINT: ${{ secrets.ASSETGROVE_R2_ENDPOINT }}
          AWS_ACCESS_KEY_ID: ${{ secrets.ASSETGROVE_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.ASSETGROVE_R2_SECRET_ACCESS_KEY }}
        run: node bench/search/remote.ts write

  read:
    needs: write
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    steps:
      - name: Check out full history on a fresh runner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
          package-manager-cache: false

      - name: Install locked dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm --dir packages/assetgrove-search install --frozen-lockfile --ignore-scripts

      - name: Verify shared picks and references without a local media cache
        env:
          ASSETGROVE_R2_BUCKET: ${{ secrets.ASSETGROVE_R2_BUCKET }}
          ASSETGROVE_R2_ENDPOINT: ${{ secrets.ASSETGROVE_R2_ENDPOINT }}
          AWS_ACCESS_KEY_ID: ${{ secrets.ASSETGROVE_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.ASSETGROVE_R2_SECRET_ACCESS_KEY }}
        run: node bench/search/remote.ts read

  cleanup:
    needs: [write, read]
    if: always() && needs.write.result != 'skipped'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Delete only this attempt's objects and verify the prefix is empty
        env:
          ASSETGROVE_R2_BUCKET: ${{ secrets.ASSETGROVE_R2_BUCKET }}
          ASSETGROVE_R2_ENDPOINT: ${{ secrets.ASSETGROVE_R2_ENDPOINT }}
          AWS_ACCESS_KEY_ID: ${{ secrets.ASSETGROVE_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.ASSETGROVE_R2_SECRET_ACCESS_KEY }}
          AWS_EC2_METADATA_DISABLED: 'true'
        shell: bash
        run: |
          if [[ -z "$AWS_ACCESS_KEY_ID" || -z "$AWS_SECRET_ACCESS_KEY" ]]; then
            echo 'Configure the scoped R2 repository secrets before dispatch.' >&2
            exit 1
          fi
          [[ "$ASSETGROVE_R2_BUCKET" =~ ^[a-z0-9][a-z0-9-]{1,61}[a-z0-9]$ ]]
          [[ "$ASSETGROVE_R2_ENDPOINT" =~ ^https://[a-f0-9]{32}(\.(eu|fedramp|us))?\.r2\.cloudflarestorage\.com$ ]]
          [[ "$ASSETGROVE_R2_PREFIX" =~ ^assetgrove-gate/[0-9]+/[0-9]+$ ]]
          aws_args=(--endpoint-url "$ASSETGROVE_R2_ENDPOINT" --region auto --no-cli-pager)
          aws "${aws_args[@]}" s3 rm "s3://$ASSETGROVE_R2_BUCKET/$ASSETGROVE_R2_PREFIX/" --recursive --only-show-errors
          count=$(aws "${aws_args[@]}" s3api list-objects-v2 --bucket "$ASSETGROVE_R2_BUCKET" \
            --prefix "$ASSETGROVE_R2_PREFIX/" --max-keys 1 --no-paginate --query KeyCount --output text)
          [[ "$count" == 0 ]]
          echo 'Verified this attempt’s R2 prefix is empty.'
