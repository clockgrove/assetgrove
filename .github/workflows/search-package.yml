name: Search package

# The optional search package (packages/assetgrove-search) has its own install and tests, kept out of
# the root install so core CI stays light. This job runs only when the package's files change, installs
# the package alone and runs its check and test commands on Linux, macOS and Windows. Not a
# required check, so it does not run in the merge queue.
on:
  pull_request:
    paths:
      - "packages/assetgrove-search/**"
      - ".github/workflows/search-package.yml"
  push:
    branches: [main]
    paths:
      - "packages/assetgrove-search/**"
      - ".github/workflows/search-package.yml"

concurrency:
  group: search-package-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  search-package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, macos-26, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: packages/assetgrove-search
    steps:
      - name: Keep line endings as committed
        working-directory: .
        run: git config --global core.autocrlf false

      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
          package-manager-cache: false

      - name: Enable pnpm from packageManager
        working-directory: .
        run: corepack enable

      - name: Install the package's locked dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts --no-optional

      - name: Check
        run: pnpm check

      - name: Test
        run: pnpm test
